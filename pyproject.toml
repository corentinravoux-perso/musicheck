[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "musicheck"
dynamic = ["version"]
description = "Check that audio files really have the quality their format claims (fake lossless, upconverted MP3s, upsampled hi-res), and sort them by properties."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Corentin Ravoux", email = "357813817+corentinravoux-perso@users.noreply.github.com"},
]
keywords = ["audio", "music", "mp3", "flac", "transcode", "spectrum", "bitrate"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "av>=14",
    "click>=8",
    "mutagen>=1.46",
    "numpy>=1.24",
    "rich>=13",
]

[project.scripts]
musicheck = "musicheck.cli:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/corentinravoux-perso/musicheck"
Repository = "https://github.com/corentinravoux-perso/musicheck"
Issues = "https://github.com/corentinravoux-perso/musicheck/issues"

[tool.setuptools.dynamic]
version = {attr = "musicheck.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["musicheck*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "musicheck/__init__.py"
